# Datos locales de conexion SQL Server: copia application-local.properties.example
# a application-local.properties en la raiz del proyecto y completa las credenciales.
spring.config.import=optional:file:./application-local.properties
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# No crear ni modificar el esquema existente de SQL Server.
spring.jpa.hibernate.ddl-auto=validate
